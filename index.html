<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Espruino WebBLE LED Dimmer</title>

<style>
  body {
    font-family: system-ui, sans-serif;
    background: #111;
    color: #eee;
    text-align: center;
    padding: 30px;
  }
  h1 { margin-bottom: 10px; }
  button {
    font-size: 16px;
    padding: 10px 20px;
    margin: 10px;
    cursor: pointer;
  }
  input[type=range] {
    width: 80%;
    margin: 20px 0;
  }
  .status {
    margin-top: 15px;
    font-weight: bold;
  }
</style>
</head>

<body>

<h1>🔵 Espruino WebBLE LED</h1>

<button onclick="connect()">Verbinden</button>
<button onclick="disconnect()">Trennen</button>

<br>

<input
  type="range"
  min="0"
  max="255"
  value="0"
  id="slider"
  disabled
>

<div>Helligkeit: <span id="value">0</span></div>

<div class="status" id="status">❌ Nicht verbunden</div>

<script>
const SERVICE_UUID = "12345678-1234-5678-1234-56789abcdef0";
const CHAR_UUID    = "12345678-1234-5678-1234-56789abcdef1";

let device = null;
let characteristic = null;

// Verbinden
async function connect() {
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }]
    });

    device.addEventListener(
      'gattserverdisconnected',
      onDisconnected
    );

    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    characteristic = await service.getCharacteristic(CHAR_UUID);

    document.getElementById("slider").disabled = false;
    setStatus("🟢 Verbunden");
  } catch (err) {
    setStatus("❌ Fehler");
    console.error(err);
  }
}

// Trennen
function disconnect() {
  if (device && device.gatt.connected) {
    device.gatt.disconnect();
  }
}

// Disconnect-Event
function onDisconnected() {
  document.getElementById("slider").disabled = true;
  setStatus("❌ Getrennt");
}

// Slider → BLE schreiben
document.getElementById("slider").addEventListener("input", async (e) => {
  const value = Number(e.target.value);
  document.getElementById("value").textContent = value;

  if (!characteristic) return;

  try {
    await characteristic.writeValue(
      Uint8Array.of(value)
    );
  } catch (err) {
    console.error("Write error:", err);
  }
});

function setStatus(text) {
  document.getElementById("status").textContent = text;
}
</script>

</body>
</html>
